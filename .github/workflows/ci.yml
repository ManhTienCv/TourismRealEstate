name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tie_db?schema=public"
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tie_db?schema=public"
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tie_db?schema=public"
        run: npm run db:generate

      - name: Build shared packages
        run: npm run build --workspace=@tie/shared

      - name: Build API backend
        run: npm run build --workspace=@tie/api

      - name: Build Web frontend
        run: npm run build --workspace=@tie/web

      - name: Lint verification
        run: npm run lint
